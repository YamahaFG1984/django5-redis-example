{% extends "blog/base.html" %}

{% block title %}My likes{% endblock %}

{% block content %}
  <h1>Posts I liked</h1>
  {% for post in posts %}
    <h2><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h2>
    <p class="date">Published {{ post.publish }} by {{ post.author }}</p>
  {% empty %}
    <p>You haven't liked any posts yet.</p>
  {% endfor %}
{% endblock %}
