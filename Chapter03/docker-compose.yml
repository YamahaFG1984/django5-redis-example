services:
  web:
    build: .
    environment:
      EMAIL_HOST_USER: 'your_account@gmail.com'
      EMAIL_HOST_PASSWORD: 'xxxxxxxxxxxx'
      DEFAULT_FROM_EMAIL: 'My Blog <your_account@gmail.com>'
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      DB_NAME: 'postgres'
      REDIS_URL: 'redis://redis:6379/0'
    volumes:
      - .:/code
  web_migrate:
    extends:
      service: web
    command: python /code/mysite/manage.py migrate
    depends_on:
      - db
      - redis
  web_run:
    extends:
      service: web
    command: python /code/mysite/manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - web_migrate
    environment:
      PYTHONPATH: "/code/mysite"
      DJANGO_SETTINGS_MODULE: "mysite.settings"
  db:
    image: postgres:16.2
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
  redis:
    image: redis:7.4-alpine
    restart: always
    # appendonly: 开启 AOF 持久化，每秒刷盘一次，重启后数据还在
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
